name: TurnoFacil CI Pipeline

# Se dispara en cualquier push o pull_request (necesario para el Checkpoint 3)
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar entorno de Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Verificar formato y estilo (Lint)
      run: go fmt ./...

    - name: Analizar código (go vet)
      run: go vet ./...

    - name: Ejecutar Tests Unitarios con Mocks
      run: go test -v ./internal/services/...

    - name: Verificar Compilación (Build)
      run: go build -v ./cmd/api/main.go